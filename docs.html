<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG Desk documentation</title><style>
:root{color-scheme:dark;--bg:#111318;--panel:#1c2028;--line:#2d3543;--text:#f2f4f8;--muted:#a8b1bf;--accent:#7ba9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}aside{padding:24px 14px;background:#171a20;border-right:1px solid var(--line)}h1{font-size:20px;margin:0 8px 20px}button{display:block;width:100%;border:0;border-radius:8px;padding:9px 10px;color:var(--muted);background:transparent;text-align:left;font:inherit;cursor:pointer}button:hover,button.active{background:#293242;color:var(--text)}a{color:var(--accent)}main{width:min(920px,100%);padding:36px clamp(22px,5vw,72px);margin:auto}article{overflow-wrap:anywhere}h1,h2,h3{line-height:1.2}h1{font-size:30px}h2{margin-top:32px}pre{overflow:auto;padding:14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);white-space:pre-wrap}ul,ol{padding-left:24px}.muted{color:var(--muted)}@media(max-width:720px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}button{min-width:max-content}.app main{padding:24px}}
</style></head><body><div class="app"><aside><h1>Documentation</h1><nav id="nav"></nav><p class="muted"><a href="/">← Back to RAG Desk</a></p></aside><main><article id="content" aria-live="polite">Loading…</article></main></div><script>
const docs=['README.md','api.md','mcp.md','monitoring_observability.md','evaluation.md','self_healing.md','security.md','deploy.md','testing.md','production_ready.md','novelties.md','files.md','feature.md'];
const label=name=>name.replace('.md','').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const content=document.querySelector('#content'),nav=document.querySelector('#nav');
function inline(text,node){const parts=text.split(/(\[[^\]]+\]\([^)]*\))/g);for(const part of parts){const match=part.match(/^\[([^\]]+)\]\(([^)]*)\)$/);if(!match){node.append(document.createTextNode(part));continue}const a=document.createElement('a');a.textContent=match[1];a.href=match[2].endsWith('.md')?`#${match[2]}`:match[2];node.append(a)}}
function render(markdown){content.replaceChildren();let list,code;for(const line of markdown.split('\n')){if(line.startsWith('```')){if(code!==undefined){const pre=document.createElement('pre');pre.textContent=code.join('\n');content.append(pre);code=undefined}else code=[];continue}if(code!==undefined){code.push(line);continue}const heading=line.match(/^(#{1,3})\s+(.*)$/);const item=line.match(/^[-*]\s+(.*)$/);if(heading){list=null;const el=document.createElement(`h${heading[1].length}`);inline(heading[2],el);content.append(el)}else if(item){if(!list){list=document.createElement('ul');content.append(list)}const el=document.createElement('li');inline(item[1],el);list.append(el)}else if(line.trim()){list=null;const el=document.createElement('p');inline(line,el);content.append(el)}}if(code!==undefined){const pre=document.createElement('pre');pre.textContent=code.join('\n');content.append(pre)}}
async function load(name){if(!docs.includes(name))name='README.md';history.replaceState(null,'',`#${name}`);[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.doc===name));content.textContent='Loading…';try{const response=await fetch(`/documentation/${name}`);if(!response.ok)throw new Error();render(await response.text())}catch{content.textContent='Documentation could not be loaded.'}}
docs.forEach(name=>{const b=document.createElement('button');b.textContent=label(name);b.dataset.doc=name;b.onclick=()=>load(name);nav.append(b)});window.onhashchange=()=>load(location.hash.slice(1));load(location.hash.slice(1)||'README.md');
</script></body></html>
