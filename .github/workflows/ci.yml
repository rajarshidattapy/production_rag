name: CI — Tests & Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Check formatting
        run: ruff format --check src/ tests/ scripts/

      - name: Type-check with mypy
        run: mypy src/

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  retrieval-quality:
    name: Retrieval regression
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      # The real embedding and reranker models, so they aren't downloaded on every run.
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('src/config.py') }}

      # Fails on a drop beyond the tolerance against data/golden_dataset/retrieval_baseline.json.
      # The wider tolerance allows for small numeric differences between machines.
      - name: Check retrieval quality against the baseline
        run: python -m scripts.evaluate_retrieval --modes vector,hybrid,hybrid_reranked --tolerance 0.05
