global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    dns_sd_configs:
      # Docker DNS returns every container behind the `api` service. Unlike a
      # single static target, this keeps per-replica `instance` labels intact.
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 15s
