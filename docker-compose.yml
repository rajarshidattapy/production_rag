services:
  redis:
    image: redis:7.2.17-alpine
    container_name: rag-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Cache and rate-limit state is intentionally ephemeral and Redis is not published to the host.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rag-chromadb
    volumes:
      # Chroma 1.x persists to /data (see /config.yaml in the image), not /chroma/chroma.
      - chroma_data:/data
    # No host port mapping: Chroma is reachable only over the internal
    # Docker network (by the `api` service, via RAG_CHROMA_HOST=chroma).
    # A published host port here would expose Chroma's unauthenticated
    # REST API directly to the network, bypassing the API service's
    # optional bearer-auth entirely (see chromadb PYSEC-2026-311 —
    # pre-auth code execution via crafted collection/embedding-function
    # requests). If external Chroma access is ever required, re-add a
    # port mapping AND enable CHROMA_SERVER_AUTHN_PROVIDER/CREDENTIALS.
    environment:
      - ANONYMIZED_TELEMETRY=False
    restart: unless-stopped
    healthcheck:
      # The image ships without curl, and /api/v1 returns 410 on Chroma 1.x. Bash's /dev/tcp
      # needs no extra tools and proves the server is accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # A range keeps the one-replica default on 8000 and lets `--scale api=N`
      # publish additional replicas on 8001, 8002, and so on.
      - "${RAG_API_PORT_RANGE:-8000-8009}:8000"
    environment:
      - RAG_CHROMA_HOST=chroma
      - RAG_CHROMA_PORT=8000
      - RAG_REDIS_URL=redis://redis:6379/0
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-openai}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gpt-4o-mini}
      - RAG_OPENROUTER_MODE=${RAG_OPENROUTER_MODE:-auto}
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RAG_ALLOW_SIGNUP=${RAG_ALLOW_SIGNUP:-true}
      - RAG_ALLOW_STORE_RESET=${RAG_ALLOW_STORE_RESET:-false}
      # Who may set the client address. Use * only once port 8000 is no longer published.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - RAG_SESSION_TTL_HOURS=${RAG_SESSION_TTL_HOURS:-720}
      - RAG_SESSION_COOKIE_SECURE=${RAG_SESSION_COOKIE_SECURE:-false}
      - RAG_CORS_ORIGINS=${RAG_CORS_ORIGINS:-*}
      - MONITOR_ENABLED=${MONITOR_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional multi-replica observability. The built-in dashboard is enough for one
  # API process; enable this profile when metrics need aggregating across replicas.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  chroma_data:
  prometheus_data:
  grafana_data:
