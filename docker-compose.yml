services:
  redis:
    image: redis:7.2.17-alpine
    container_name: rag-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Cache and rate-limit state is intentionally ephemeral and Redis is not published to the host.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery is deliberately opt-in. The default single-API deployment uses no broker; start
  # this durable broker and the worker with `docker compose --profile celery up` only when
  # API replicas need to share indexing jobs.
  celery-broker:
    profiles: ["celery"]
    image: redis:7.2.17-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - celery_broker_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rag-chromadb
    volumes:
      # Chroma 1.x persists to /data (see /config.yaml in the image), not /chroma/chroma.
      - chroma_data:/data
    # No host port mapping: Chroma is reachable only over the internal
    # Docker network (by the `api` service, via RAG_CHROMA_HOST=chroma).
    # A published host port here would expose Chroma's unauthenticated
    # REST API directly to the network, bypassing the API service's
    # optional bearer-auth entirely (see chromadb PYSEC-2026-311 —
    # pre-auth code execution via crafted collection/embedding-function
    # requests). If external Chroma access is ever required, re-add a
    # port mapping AND enable CHROMA_SERVER_AUTHN_PROVIDER/CREDENTIALS.
    environment:
      - ANONYMIZED_TELEMETRY=False
    restart: unless-stopped
    healthcheck:
      # The image ships without curl, and /api/v1 returns 410 on Chroma 1.x. Bash's /dev/tcp
      # needs no extra tools and proves the server is accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - RAG_CHROMA_HOST=chroma
      - RAG_CHROMA_PORT=8000
      - RAG_REDIS_URL=redis://redis:6379/0
      - RAG_INGEST_QUEUE=${RAG_INGEST_QUEUE:-local}
      - RAG_CELERY_BROKER_URL=${RAG_CELERY_BROKER_URL:-redis://celery-broker:6379/0}
      - RAG_CELERY_TASK_QUEUE=${RAG_CELERY_TASK_QUEUE:-rag-ingest}
      - RAG_CELERY_VISIBILITY_TIMEOUT_SECONDS=${RAG_CELERY_VISIBILITY_TIMEOUT_SECONDS:-259200}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-openai}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gpt-4o-mini}
      - RAG_OPENROUTER_MODE=${RAG_OPENROUTER_MODE:-auto}
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RAG_ALLOW_SIGNUP=${RAG_ALLOW_SIGNUP:-true}
      - RAG_ALLOW_STORE_RESET=${RAG_ALLOW_STORE_RESET:-false}
      - RAG_MCP_ENABLED=${RAG_MCP_ENABLED:-false}
      - RAG_MCP_ALLOWED_HOSTS=${RAG_MCP_ALLOWED_HOSTS:-}
      - RAG_REDACT_ANSWERS
      - RAG_SOURCE_ROLES
      # Who may set the client address. Use * only once port 8000 is no longer published.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - RAG_SESSION_TTL_HOURS=${RAG_SESSION_TTL_HOURS:-720}
      - RAG_SESSION_COOKIE_SECURE=${RAG_SESSION_COOKIE_SECURE:-false}
      - RAG_CORS_ORIGINS=${RAG_CORS_ORIGINS:-*}
      - MONITOR_ENABLED=${MONITOR_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ingest-worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - -m
      - celery
      - --app=src.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    environment:
      - RAG_DATA_DIR=/app/data
      - RAG_CHROMA_HOST=chroma
      - RAG_CHROMA_PORT=8000
      - RAG_REDIS_URL=redis://redis:6379/0
      - RAG_INGEST_QUEUE=celery
      - RAG_CELERY_BROKER_URL=${RAG_CELERY_BROKER_URL:-redis://celery-broker:6379/0}
      - RAG_CELERY_TASK_QUEUE=${RAG_CELERY_TASK_QUEUE:-rag-ingest}
      - RAG_CELERY_VISIBILITY_TIMEOUT_SECONDS=${RAG_CELERY_VISIBILITY_TIMEOUT_SECONDS:-259200}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-800}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-150}
      - RAG_INGEST_BATCH_SIZE=${RAG_INGEST_BATCH_SIZE:-2000}
      - RAG_MAX_FILE_SIZE_MB=${RAG_MAX_FILE_SIZE_MB:-50}
      - RAG_MAX_PDF_PAGES=${RAG_MAX_PDF_PAGES:-1000}
      - RAG_SEMANTIC_DEDUPLICATION=${RAG_SEMANTIC_DEDUPLICATION:-true}
      - RAG_SEMANTIC_DEDUPLICATION_THRESHOLD=${RAG_SEMANTIC_DEDUPLICATION_THRESHOLD:-0.985}
      - RAG_REDACT_CREDENTIALS=${RAG_REDACT_CREDENTIALS:-true}
      - RAG_PII_MODE=${RAG_PII_MODE:-flag}
      - RAG_INJECTION_MODE=${RAG_INJECTION_MODE:-flag}
      - RAG_INJECTION_TRUSTED_AUTHORITY
      - RAG_SOURCE_AUTHORITY
      - RAG_SOURCE_COLLECTIONS
      - RAG_SOURCE_ROLES
    volumes:
      # API replicas and the worker must see the same sources, job state, and chat database.
      - ./data:/app/data
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-broker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  celery_broker_data:
