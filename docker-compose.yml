services:
  redis:
    image: redis:7.2.17-alpine
    container_name: rag-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Cache and rate-limit state is intentionally ephemeral and Redis is not published to the host.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional ingest job queue. Start with `docker compose --profile kafka up` and set
  # RAG_INGEST_QUEUE=kafka. Single-node KRaft; like Redis, not published to the host.
  kafka:
    image: apache/kafka:4.3.2
    container_name: rag-kafka
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Ingest jobs need a single-partition topic; the app creates it, this covers auto-create.
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Waiting jobs must survive a broker restart, so the log is kept on a volume.
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rag-chromadb
    volumes:
      # Chroma 1.x persists to /data (see /config.yaml in the image), not /chroma/chroma.
      - chroma_data:/data
    # No host port mapping: Chroma is reachable only over the internal
    # Docker network (by the `api` service, via RAG_CHROMA_HOST=chroma).
    # A published host port here would expose Chroma's unauthenticated
    # REST API directly to the network, bypassing the API service's
    # optional bearer-auth entirely (see chromadb PYSEC-2026-311 —
    # pre-auth code execution via crafted collection/embedding-function
    # requests). If external Chroma access is ever required, re-add a
    # port mapping AND enable CHROMA_SERVER_AUTHN_PROVIDER/CREDENTIALS.
    environment:
      - ANONYMIZED_TELEMETRY=False
    restart: unless-stopped
    healthcheck:
      # The image ships without curl, and /api/v1 returns 410 on Chroma 1.x. Bash's /dev/tcp
      # needs no extra tools and proves the server is accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - RAG_CHROMA_HOST=chroma
      - RAG_CHROMA_PORT=8000
      - RAG_REDIS_URL=redis://redis:6379/0
      - RAG_INGEST_QUEUE=${RAG_INGEST_QUEUE:-local}
      - RAG_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-openai}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gpt-4o-mini}
      - RAG_OPENROUTER_MODE=${RAG_OPENROUTER_MODE:-auto}
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RAG_ALLOW_SIGNUP=${RAG_ALLOW_SIGNUP:-true}
      - RAG_ALLOW_STORE_RESET=${RAG_ALLOW_STORE_RESET:-false}
      # Who may set the client address. Use * only once port 8000 is no longer published.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - RAG_SESSION_TTL_HOURS=${RAG_SESSION_TTL_HOURS:-720}
      - RAG_SESSION_COOKIE_SECURE=${RAG_SESSION_COOKIE_SECURE:-false}
      - RAG_CORS_ORIGINS=${RAG_CORS_ORIGINS:-*}
      - MONITOR_ENABLED=${MONITOR_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false # only when the kafka profile is enabled
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chroma_data:
  kafka_data:
